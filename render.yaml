services:
  - type: web
    name: puantaj-maas-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: REGISTER_INVITE_KEY_HASH
        sync: false
      - key: PG_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: https://puantaj-maas-backend.onrender.com,http://localhost:8081,http://localhost:19006
      - key: UPLOADS_DIR
        value: /var/data/uploads
